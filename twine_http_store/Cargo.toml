[package]
name = "twine_http_store"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
description = "Twine protocol rust library http store"

[features]
default = ["rustls-tls"]
server = ["hyper", "hyper-util", "http-body", "http-body-util"]
# TLS backends for the reqwest client. `rustls-tls` (the default) is a pure-Rust
# backend that needs no system OpenSSL/pkg-config. Opt into `native-tls` to link
# against the platform's OpenSSL instead.
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]

[[example]]
name = "server"
required-features = ["server"]

[dependencies]
twine_lib.workspace = true
futures.workspace = true
async-trait.workspace = true
# fvm_ipld_car = "0.7"
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["stream", "brotli", "json", "http2", "charset", "system-proxy"] }
itertools.workspace = true
backon = "1.3"
hyper = { version = "1.6.0", optional = true, features = ["http1", "server"] }
hyper-util = { version = "0.1", optional = true }
http-body-util = { version = "^0.1", optional = true }
http-body = { version = "^1.0", optional = true }
thiserror.workspace = true

[dev-dependencies]
tokio.workspace = true
futures-time = "3.0"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"]}
tower = "0.5.2"
tower-service = "0.3"
twine_builder.workspace = true
